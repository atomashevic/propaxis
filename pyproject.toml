[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "propaxis"
version = "0.1.0"
description = "Proposition-based text measurement and classification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Aleksandar Tomašević"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
models = ["torch>=2.2,<3", "transformers>=4.44,<5", "huggingface-hub>=0.26,<1", "safetensors>=0.4"]
notebook = ["ipywidgets>=8,<9", "pandas>=2,<4"]
dev = ["pytest>=8,<9", "build>=1.2", "ruff>=0.11", "ipywidgets>=8,<9"]

[project.urls]
Homepage = "https://github.com/atomashevic/propaxis"
Documentation = "https://github.com/atomashevic/propaxis#readme"
Issues = "https://github.com/atomashevic/propaxis/issues"

[project.scripts]
propaxis = "propaxis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/propaxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
